[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "option-pricer-backend"
version = "0.1.0"
description = "Backend for the option pricing web application."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "scipy",
    "uvicorn[standard]",
]

[project.optional-dependencies]
test = [
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

